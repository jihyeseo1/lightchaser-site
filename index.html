<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightchaser</title>

    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/home2 copy.css" />
  </head>

  <body>
    <div data-include-path="components/header.html"></div>
    <!-- 전체 사이트 마우스 빛 -->
    <canvas class="global-light-canvas"></canvas>

    <!-- 현재 화면 아래쪽 스크롤 유도 빛 -->
    <div class="global-bottom-glow"></div>

    <div data-include-path="components/header.html"></div>
    <main>
      <!-- =============================================
           01 HERO
           ============================================= -->
      <section class="main-visual">
        <!-- 중앙 심볼 내부 영상 -->
        <div class="hero-symbol">
          <video autoplay muted loop playsinline preload="auto">
            <source src="assets/videos/gwanghwa-main.mp4" type="video/mp4" />
          </video>
        </div>

        <!-- 좌측 하단 소개 -->
        <div class="hero-copy">
          <h1>빛을 쫓는 사람들</h1>

          <p>
            라이트체이서는 공간에 숨겨진 이야기를<br />
            빛, 소리, 영상, 조명으로 재해석하는 공간 스토리텔링 미디어아트
            그룹입니다
          </p>
        </div>
      </section>

      <!-- =============================================
           02 STICKY SCENES
           ============================================= -->
      <section class="sticky-container">
        <div class="sticky-frame">
          <div class="scene scene-1 active">
            <div class="content-text">
              <p class="scene-eyebrow">OUR WORK</p>

              <h3>
                media facade <br />
                / lightting installration
                <br />/ performance<br />
                <!-- <strong>Shaping Space.</strong> -->
              </h3>
            </div>
          </div>

          <div class="scene scene-2">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/media.jpg')"
            ></div>

            <span class="scene-num">01</span>

            <div class="content-box">
              <h3>Media Facade</h3>

              <a href="project.html" class="btn-view">
                View

                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="scene scene-3">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/perform.jpg')"
            ></div>

            <span class="scene-num">02</span>

            <div class="content-box">
              <h3>Performance</h3>

              <a href="project-tunnel.html" class="btn-view">
                View

                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="scene scene-4">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/exhibit.jpg')"
            ></div>

            <span class="scene-num">03</span>

            <div class="content-box">
              <h3>Exhibition</h3>

              <a href="project-shinsagae.html" class="btn-view">
                View

                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="indicators">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </section>

      <!-- =============================================
           03 CONTACT
           ============================================= -->
      <section class="bottom-contact">
        <h2>
          Let's create<br />
          something brilliant.
        </h2>

        <a href="contact.html" class="btn-contact">
          CONTACT US

          <svg viewBox="0 0 12 12" fill="none">
            <path
              d="M1 6h10M6 1l5 5-5 5"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </section>
    </main>

    <!-- =============================================
         04 INDIVIDUAL WORKS
         ============================================= -->
    <section class="individual-works">
      <div class="inner">
        <div class="section-title">
          <span>Crafted by our team</span>
          <h3>Individual Creative Works</h3>
        </div>
      </div>

      <div class="marquee-container">
        <div class="marquee-track">
          <div class="work-card">
            <img
              src="assets/images/project/gwanghwa/output/out-01.png"
              alt="Work 01"
            />
          </div>

          <div class="work-card">
            <img
              src="assets/images/project/shinsagae/technical/tech-01-01.png"
              alt="Work 02"
            />
          </div>

          <div class="work-card">
            <img
              src="assets/images/project/section/output/01.png"
              alt="Work 03"
            />
          </div>

          <div class="work-card">
            <img
              src="assets/images/project/ulsan/output/01.png"
              alt="Work 04"
            />
          </div>

          <div class="work-card">
            <img
              src="assets/images/project/tunnel/output/10.png"
              alt="Work 05"
            />
          </div>

          <!-- 무한 루프용 복사 -->

          <div class="work-card">
            <img
              src="assets/images/project/gwanghwa/output/out-01.png"
              alt=""
            />
          </div>

          <div class="work-card">
            <img
              src="assets/images/project/shinsagae/technical/tech-01-01.png"
              alt=""
            />
          </div>

          <div class="work-card">
            <img src="assets/images/project/section/output/01.png" alt="" />
          </div>

          <div class="work-card">
            <img src="assets/images/project/ulsan/output/01.png" alt="" />
          </div>

          <div class="work-card">
            <img src="assets/images/project/tunnel/output/10.png" alt="" />
          </div>
        </div>
      </div>
    </section>

    <div data-include-path="components/footer.html"></div>

    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script src="js/scroll.js"></script>
  </body>
</html>
