<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightchaser</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/home2.css" />
  </head>
  <body>
    <div data-include-path="components/header.html"></div>

    <main>
      <!-- ── 01 HERO ── -->
      <section class="main-visual">
        <!-- 배경 로고 이미지 -->
        <img
          class="hero-bg-logo"
          src="assets/images/common/lcsymbol.png"
          alt=""
          onerror="this.style.display='none'"
        />

        <!-- 우상단 연도 레이블 -->
        <span class="hero-corner">SEOUL — 2026</span>

        <!-- 하단 타이틀 + 서브 -->
        <div class="hero-foot">
          <h2 class="hero-title">LIGHT<br />CHASER</h2>
          <div class="hero-sub">
            <p>빛으로 공간을 만들다.<br /></p>
            <a href="project.html" class="hero-link">
              VIEW PROJECTS
              <svg viewBox="0 0 11 11" fill="none">
                <path
                  d="M1 5.5h9M5.5 1l4.5 4.5-4.5 4.5"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </div>

        <!-- 하단 중앙 메타
        <div class="hero-meta">
          <span>Light</span>
          <span>Space</span>
          <span>Technology</span>
        </div> -->

        <!-- 스크롤 힌트 -->
        <div class="scroll-guide">
          <div class="scroll-line"></div>
          <span>SCROLL</span>
        </div>
      </section>

      <!-- ── 02 STICKY SCENES ── -->
      <section class="sticky-container">
        <div class="sticky-frame">
          <div class="scene scene-1 active">
            <div class="content-text">
              <p class="scene-eyebrow">OUR WORK</p>
              <h3>Chasing Light,<br /><strong>Shaping Space.</strong></h3>
            </div>
          </div>

          <div class="scene scene-2">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/media.jpg')"
            ></div>
            <span class="scene-num">01</span>
            <div class="content-box">
              <h3>Media Facade</h3>
              <a href="project.html" class="btn-view">
                View
                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="scene scene-3">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/perform.jpg')"
            ></div>
            <span class="scene-num">02</span>
            <div class="content-box">
              <h3>Performance</h3>
              <a href="project-tunnel.html" class="btn-view">
                View
                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="scene scene-4">
            <div
              class="bg-img"
              style="background-image: url('assets/images/home/exhibit.jpg')"
            ></div>
            <span class="scene-num">03</span>
            <div class="content-box">
              <h3>Exhibition</h3>
              <a href="project-shinsagae.html" class="btn-view">
                View
                <svg viewBox="0 0 9 9" fill="none">
                  <path
                    d="M1 4.5h7M4.5 1l3.5 3.5-3.5 3.5"
                    stroke="currentColor"
                    stroke-width="1.1"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </a>
            </div>
          </div>

          <div class="indicators">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </section>

      <!-- ── 03 CONTACT CTA ── -->
      <section class="bottom-contact">
        <h2>Let's create<br />something brilliant.</h2>
        <a href="contact.html" class="btn-contact">
          CONTACT US
          <svg viewBox="0 0 12 12" fill="none">
            <path
              d="M1 6h10M6 1l5 5-5 5"
              stroke="currentColor"
              stroke-width="1.3"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </a>
      </section>
    </main>

    <!-- ── 04 INDIVIDUAL WORKS MARQUEE ── -->
    <section class="individual-works">
      <div class="inner">
        <div class="section-title">
          <span>Crafted by our team</span>
          <h3>Individual Creative Works</h3>
        </div>
      </div>

      <div class="marquee-container">
        <div class="marquee-track">
          <div class="work-card">
            <img
              src="assets/images/project/gwanghwa/output/out-01.png"
              alt="Work 01"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/shinsagae/technical/tech-01-01.png"
              alt="Work 05"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/section/output/01.png"
              alt="Work 02"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/ulsan/output/01.png"
              alt="Work 03"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/tunnel/output/10.png"
              alt="Work 04"
            />
          </div>
          <!-- 루프용 복사 -->
          <div class="work-card">
            <img
              src="assets/images/project/gwanghwa/output/out-01.png"
              alt="Work 01"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/shinsagae/technical/tech-01-01.png"
              alt="Work 05"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/section/output/01.png"
              alt="Work 02"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/ulsan/output/01.png"
              alt="Work 03"
            />
          </div>
          <div class="work-card">
            <img
              src="assets/images/project/tunnel/output/10.png"
              alt="Work 04"
            />
          </div>
        </div>
      </div>
    </section>

    <div data-include-path="components/footer.html"></div>

    <script src="js/include.js"></script>
    <script src="js/main.js"></script>
    <script src="js/scroll.js"></script>
  </body>
</html>
